# English and Spanish must match: every key in both dictionaries, every key the page uses.
name: i18n check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - run: node ds/check-i18n.mjs --dict i18n/en.js --dict i18n/es.js --html index.html
