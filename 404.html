<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Should</title>
<script>
  // GitHub Pages serves only this root 404 for unknown paths. The demo is a single-page app, so a deep link
  // (/should/demo/r/health) comes back to the app with the path in ?p= and the app restores it.
  (function () {
    var base = '/should/demo', p = location.pathname;
    if (p.indexOf(base + '/') === 0) location.replace(base + '/?p=' + encodeURIComponent(p.slice(base.length) + location.search) + location.hash);
  })();
</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, sans-serif; background: #141412; color: #ece8e0; padding-inline: 16px; }
  a { color: #5cc49b; }
</style>
</head>
<body>
<p>Page not found · Página no encontrada. <a href="/should/">Should</a></p>
</body>
</html>
