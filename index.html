<script>
/* Structure only. Every visible word is in i18n/en.js and i18n/es.js (same shape, checked by ds/check-i18n.mjs). */
const AGENTS = {
  ea:{i:"🧭"}, book:{i:"📒"}, sched:{i:"🗓️"}, pi:{i:"🔎"}, health:{i:"🩺"}, chef:{i:"👩‍🍳"}, nutri:{i:"🥗"}, text:{i:"💬"}, phil:{i:"📚"}, sec:{i:"🛡️"},
  comp:{i:"⚖️"}, bcoach:{i:"🧭",toYou:true}, coach:{i:"🏁"}, career:{i:"💼"}, wealth:{i:"📈"}, shop:{i:"🛒"},
  house:{i:"🏠"}, move:{i:"📦"}, gift:{i:"🎁"}, relmgr:{i:"🤝"}, events:{i:"🎉"}, legal:{i:"⚖️"},
  music:{i:"🎹"}, web:{i:"🖥️"}, pr:{i:"📣"}, media:{i:"🎬"}, guide:{i:"📍"}, biz:{i:"🏢"}, ba:{i:"📊"}, arch:{i:"🏗️"}, dba:{i:"🗄️"}, it:{i:"🛠️"},
  pm:{i:"🧩"}, design:{i:"🎨"}, rel:{i:"💬",soon:true},
};
// Each agent's person avatar comes from the design system (ds/avatars.global.js), keyed by org role
const ORG={ea:"assistant",book:"bookkeeper",sched:"scheduler",pi:"investigator",health:"health",chef:"chef",nutri:"nutritionist",text:"text-concierge",phil:"philosopher",sec:"security",comp:"compliance",bcoach:"business_coach",coach:"coach",career:"career",wealth:"financial",shop:"shopping",house:"home-manager",move:"relocation",gift:"gifts",relmgr:"relationship-manager",events:"events",legal:"legal",music:"music",web:"webmaster",pr:"pr",media:"media",guide:"local-guide",biz:"business",ba:"business_analyst",arch:"as-architect",dba:"dba",it:"it",pm:"product",design:"designer",rel:"relationships"};

const GOALS = [
 {id:"career",agents:["career","pi","pr"],sc:[{ico:"🎯",scene:"lead"},{ico:"✍️",scene:"resume"},{ico:"🤝",scene:"offer",sim:"negotiate"},{ico:"🪜",scene:"ladder"}]},
 {id:"money",agents:["wealth","book","pi"],sc:[{ico:"📈",sim:"trade"},{ico:"🏖️",sim:"retire"},{ico:"🧾",scene:"stmt"},{ico:"🪜",scene:"ladder"}]},
 {id:"business",agents:["biz","ba","book","legal"],sc:[{ico:"📊",scene:"dash"},{ico:"🌳",scene:"tree"},{ico:"🪜",scene:"ladder"}]},
 {id:"health",agents:["health","shop"],sc:[{ico:"⚖️",sim:"body"},{ico:"🥘",scene:"meals"},{ico:"🩺"},{ico:"🚭",scene:"streak"},{ico:"🪜",scene:"ladder"}]},
 {id:"home",agents:["relmgr","house"],sc:[{ico:"👨‍👧‍👦",scene:"coparent"},{ico:"🔧",scene:"repair"},{ico:"🪜",scene:"ladder"}]},
 {id:"style",agents:["shop","gift"],sc:[{ico:"🏷️",scene:"price"},{ico:"👔",scene:"outfit"},{ico:"🎂",scene:"bdays"},{ico:"🪜",scene:"ladder"}]},
 {id:"people",agents:["relmgr","pi","events"],sc:[{ico:"📇",scene:"contact"},{ico:"🪜",scene:"ladder"}]},
 {id:"legal",agents:["legal","comp"],sc:[{ico:"📄",scene:"doc"},{ico:"🗂️"},{ico:"✅"}]},
 {id:"logistics",agents:["arch","it","dba","design","web"],sc:[{ico:"🏗️"},{ico:"🔐"},{ico:"🗄️"}]},
 {id:"coaching",agents:["coach","bcoach"],sc:[{ico:"🗓️",scene:"week"},{ico:"📏",scene:"pace"},{ico:"🧭",scene:"review"},{ico:"📓",scene:"log"}]},
];
const LEADS=["ea"]; // your go-to agent; the staff reports to it. bg:true = background role, not shown
const COACHES=["coach","bcoach","rel"]; // "coach" is reserved for these long-term guides (Rod 11/16): grouped and shown above the staff, reporting to you

/* Dynamic values (positions, widths, percentages) are set through the CSSOM, which a strict CSP allows; style attributes are not */
const applySt=()=>document.querySelectorAll("[data-st]").forEach(e=>{e.getAttribute("data-st").split(";").forEach(d=>{const i=d.indexOf(":");if(i>0)e.style.setProperty(d.slice(0,i).trim(),d.slice(i+1).trim());});e.removeAttribute("data-st");});
new MutationObserver(applySt).observe(document.documentElement,{childList:true,subtree:true});
document.addEventListener("DOMContentLoaded",applySt);

/* ---------- language ---------- */
const I=window.DSI18n, DICT=window.SHOULD_I18N||{};
// A dictionary that failed to load falls back to English (or whichever one did load), so a network blip never blanks the page
const have=l=>DICT[l]?l:DICT.en?"en":Object.keys(DICT)[0];
let lang=have(I.pickLang()), L=DICT[lang];
const fmt=(s,v)=>String(s).replace(/\{(\w+)\}/g,(m,k)=>k in v?v[k]:m);
const agent=k=>({...AGENTS[k],...L.agents[k]});
const goalText=id=>L.goals[id];

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>"$"+Math.round(n).toLocaleString(L.sims.money_locale);
const av=(k,size,badge=true)=>window.DSAvatars?DSAvatars.avatarSVG(ORG[k]||k,{size,badge,label:agent(k).n}):AGENTS[k].i;

/* ---------- scenes: one picture per scenario ---------- */
const rung=(r,now)=>`<div class="rung${now?" now":""}"><small>${r[0]}</small><b>${r[1]}</b><span>${r[2]}</span></div>`;
const SCENES={
 lead:()=>{const S=L.scenes.lead;return `<div class="lead-card"><div class="lc-top"><div><b>${S.role}</b><span>${S.co}</span></div><div class="ring" data-st="--p:92"><span>92%</span></div></div>
  <ul class="checks">${S.checks.map(c=>`<li>${c}</li>`).join("")}</ul>
  <div class="dropped"><small>${S.dropped_h}</small>${S.dropped.map(d=>`<s>${esc(d)}</s>`).join("")}</div></div>`},
 resume:()=>{const S=L.scenes.resume,on=[1,1,1,1,0];return `<div class="doc"><div class="doc-h"><b>${S.name}</b><span>${S.tailored}</span></div>
  ${S.rows.map(r=>`<p><del>${r[0]}</del> <ins>${r[1]}</ins></p>`).join("")}<p>${S.plain}</p>
  <div class="kw"><small>${S.kw_h}</small>${S.kw.map((k,i)=>`<span class="pill${on[i]?" on":""}">${k}</span>`).join("")}</div></div>`},
 offer:()=>{const S=L.scenes.offer,X=v=>((v-140)/60*100).toFixed(1)+"%";return `<div class="range"><div class="rg-track"><div class="rg-band" data-st="left:${X(170)};width:${(15/60*100).toFixed(1)}%"></div>
  <i class="mk off" data-st="left:${X(160)}"><b>${S.offer}</b>$160k</i><i class="mk floor" data-st="left:${X(165)}"><b>${S.floor}</b>$165k</i><i class="mk ctr" data-st="left:${X(178)}"><b>${S.counter}</b>$178k</i></div>
  <div class="rg-axis"><span>$140k</span><span class="mkt">${S.market}</span><span>$200k</span></div></div>`},
 ladder:w=>{const Lw=w.text.ladder;return `<div class="ladder"><div class="ld-h"><b>${Lw.h}</b><span>${Lw.sub}</span></div>${Lw.rungs.map((r,i)=>rung(r,i===2)).join("")}</div>`},
 week:()=>{const S=L.scenes.week;return `<div class="ladder"><div class="ld-h"><b>${S.h}</b><span>${S.sub}</span></div>${S.rows.map(r=>rung(r)).join("")}${rung(S.now,1)}</div>`},
 pace:()=>{const S=L.scenes.pace,pct=[70,45,50];return `<div class="ladder"><div class="ld-h"><b>${S.h}</b><span>${S.sub}</span></div>
  <ul class="dl pace">${S.rows.map((r,i)=>`<li><span>${r[0]}</span><i data-st="--w:${pct[i]}%"></i><b>${r[1]}</b></li>`).join("")}</ul></div>`},
 review:()=>{const S=L.scenes.review,met=[1,1,0];return `<div class="ladder"><div class="ld-h"><b>${S.h}</b><span>${S.sub}</span></div>${S.rows.map((r,i)=>rung(r,!met[i])).join("")}${rung(S.jan)}</div>`},
 log:()=>{const S=L.scenes.log;return `<div class="ladder"><div class="ld-h"><b>${S.h}</b><span>${S.sub}</span></div>${S.rows.map(r=>rung(r)).join("")}</div>`},
 stmt:()=>{const S=L.scenes.stmt,cls=["","flag","","due"];return `<div class="stmt"><div class="st-h"><b>${S.h}</b><span>${S.sub}</span></div>
  ${S.rows.map((r,i)=>`<div class="row${cls[i]?" "+cls[i]:""}"><span>${r[0]}</span><span>${r[1]}${r[3]?`<em>${r[3]}</em>`:""}</span><b>${r[2]}</b></div>`).join("")}</div>`},
 dash:()=>{const S=L.scenes.dash,cls=["","warn",""],w=[60,25,10];return `<div class="kpis">${S.kpis.map((k,i)=>`<div${cls[i]?` class="${cls[i]}"`:""}><small>${k[0]}</small><b>${k[1]}</b><span${i===0?' class="up"':""}>${k[2]}</span></div>`).join("")}</div>
  <ul class="dl">${S.dl.map((d,i)=>`<li><span>${d[0]}</span><i data-st="--w:${w[i]}%"></i><b>${d[1]}</b></li>`).join("")}</ul>`},
 tree:()=>{const S=L.scenes.tree,cls=["","new",""];return `<div class="tree"><div class="node top">${S.top[0]}<small>${S.top[1]}</small></div><div class="kids">${S.kids.map((k,i)=>`<div class="node${cls[i]?" "+cls[i]:""}">${k[0]}<small>${k[1]}</small></div>`).join("")}</div></div>`},
 meals:()=>{const S=L.scenes.meals,ico=["🌮","🐟","🍗","🥩","🍤","🍲","🥗"];
  return `<div class="meals">${S.days.map((d,i)=>`<div><small>${d[0]}</small><span>${ico[i]}</span><b>${d[1]}</b></div>`).join("")}</div><div class="cart"><span>${S.cart}</span><b>${S.total}</b><span>${S.protein}</span></div>`},
 streak:()=>{const S=L.scenes.streak;return `<div class="streak"><div class="why"><small>${S.why_h}</small>${esc(S.why)}</div>
  <div class="dots">${Array.from({length:35},(_,i)=>`<i class="${i<29?"on":i===29?"today":""}"></i>`).join("")}</div>
  <div class="st-n">${S.n.map(n=>`<div><b>${n[0]}</b><span>${n[1]}</span></div>`).join("")}</div></div>`},

function chart(series,{w=320,h=170,yfmt=v=>v,xlab=[]}={}){
  const all=series.flatMap(s=>s.d); const max=Math.max(...all), min=Math.min(0,...all)*0+Math.min(...series.map(s=>s.min??Math.min(...s.d)));
  const lo=series[0].lo??min, hi=max*1.05; const n=series[0].d.length;
  const X=i=>34+(w-44)*i/(n-1), Y=v=>h-22-(h-34)*(v-lo)/(hi-lo||1);
  let g=`<svg class="chart" viewBox="0 0 ${w} ${h}" role="img">`;
  [0,.5,1].forEach(f=>{const v=lo+(hi-lo)*f; g+=`<line x1="34" x2="${w-10}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="30" y="${Y(v)+4}" font-size="10" text-anchor="end" fill="var(--muted)">${yfmt(v)}</text>`});
  xlab.forEach(([i,t])=>g+=`<text x="${X(i)}" y="${h-6}" font-size="10" text-anchor="${i===0?'start':i===n-1?'end':'middle'}" fill="var(--muted)">${t}</text>`);
  series.forEach(s=>{g+=`<polyline fill="none" stroke="${s.c}" stroke-width="2.5" stroke-linejoin="round" ${s.dash?'stroke-dasharray="5 4"':''} points="${s.d.map((v,i)=>X(i).toFixed(1)+","+Y(v).toFixed(1)).join(" ")}"/>`});
  return g+`</svg>`;
}
function ctl(id,label,min,max,step,val,f){return `<label class="ctl" for="${id}"><span>${label}</span><output id="${id}o">${f(val)}</output><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"></label>`}

  $("#reachTabs").innerHTML=ex.map((e,i)=>`<button class="tab" role="tab" aria-selected="${i===reachI}" data-reach="${i}">${e.tab}</button>`).join("");
  const ph=$("#reachPhone"); ph.setAttribute("aria-label",ex[reachI].tab);
  ph.innerHTML=ex[reachI].phone.map(([k,h])=>k==="who"?`<div class="whoname">${h}</div>`:k==="time"?`<div class="time">${h}</div>`:`<div class="msg ${k}">${h}</div>`).join("");
}
// TV showcase: swap the framed screenshot; its alt text follows the tab and the language
document.addEventListener("click",e=>{const b=e.target.closest("[data-tv]");if(!b)return;const k=b.dataset.tv,img=$("#tvImg");
  document.querySelectorAll("[data-tv]").forEach(x=>x.setAttribute("aria-selected",String(x===b)));
  img.src=`img/tv/tv-${k}.webp`;img.setAttribute("data-i18n-attr",`alt:ui.tv_alt_${k}`);img.alt=L.ui[`tv_alt_${k}`];});
document.addEventListener("click",e=>{const b=e.target.closest("[data-reach]");if(b){reachI=+b.dataset.reach;renderReach();}});
function renderStaff(){
  const order=Object.keys(AGENTS).filter(k=>!AGENTS[k].bg&&!LEADS.includes(k)&&!COACHES.includes(k));
  const card=k=>{const a=agent(k);const lead=LEADS.includes(k)||COACHES.includes(k);
    return `<button class="agent${lead?" lead":""}" data-agent="${k}"><span class="ico">${av(k,44)}</span><div><b>${a.n}</b>${a.soon?`<span class="soon">${L.ui.coming_soon}</span>`:""}<span>${esc(a.job.split(". ")[0].replace(/\.$/,""))}</span></div></button>`};
  $("#leadgrid").innerHTML=LEADS.map(card).join("");
  $("#coachgrid").innerHTML=COACHES.map(card).join("");
  $("#staffgrid").innerHTML=order.map(card).join("");
}
function openAgent(k){
  const a=agent(k); const goals=GOALS.filter(g=>g.agents.includes(k));
  $("#sheetBody").innerHTML=`<div class="sheet-head"><div class="goal-ico">${av(k,56)}</div><h3 id="sheetTitle" class="fs24">${a.n}</h3></div>
   <p>${esc(a.job)}</p>
   <div class="kv"><div><small>${L.ui.routines}</small>${a.routines.map(esc).join(" · ")}</div>
   <div><small>${L.ui.never}</small>${esc(a.never)}</div>
   ${goals.length?`<div><small>${L.ui.works_on}</small>${goals.map(g=>`<button class="tab mr6" data-jump="${g.id}">${goalText(g.id).tab}</button>`).join("")}</div>`:""}
   <div><small>${L.ui.reports_to}</small>${LEADS.includes(k)||COACHES.includes(k)||a.toYou?L.ui.you:agent("ea").n}</div></div>`;
  $("#shade").classList.add("on");$("#sheet").classList.add("on");document.body.classList.add("locked");$("#sheetX").focus();
}
function closeSheet(){$("#shade").classList.remove("on");$("#sheet").classList.remove("on");document.body.classList.remove("locked")}

function setLang(l){
  lang=have(l); L=DICT[lang]; I.applyLang(lang);
  renderStatic(); renderStaff(); renderGoal(current.id,current.si); closeSheet();
  menu.set(l,L.meta.lang_label);
}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-si],[data-g],[data-agent],[data-jump],[data-reply]");
  if(!t)return;
  if(t.dataset.si!==undefined){renderGoal(t.dataset.gid,+t.dataset.si);}
  else if(t.dataset.g){renderGoal(t.dataset.g);}
  else if(t.dataset.agent){openAgent(t.dataset.agent);}
  else if(t.dataset.jump){closeSheet();renderGoal(t.dataset.jump);$("#goals").scrollIntoView();}
  else if(t.dataset.reply!==undefined){const box=t.closest(".ask");box.querySelectorAll("button").forEach(b=>b.classList.remove("picked"));t.classList.add("picked");const r=box.querySelector(".reply");r.textContent=t.dataset.reply;r.classList.add("show");}
});
$("#shade").onclick=closeSheet;$("#sheetX").onclick=closeSheet;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
const menu=I.langMenu($("#lang"),{current:lang,label:L.meta.lang_label,onChange:setLang});
setLang(lang);
</script>
</body>
</html>
