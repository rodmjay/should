<!doctype html>
<html lang="en" data-brand="should" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="google" content="notranslate">
<link rel="alternate" hreflang="en" href="https://rodmjay.github.io/should/?lang=en">
<link rel="alternate" hreflang="es-419" href="https://rodmjay.github.io/should/?lang=es">
<link rel="alternate" hreflang="x-default" href="https://rodmjay.github.io/should/">
<title>Should</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<!-- Link previews can't run scripts, so description and og: stay in English here; the page sets the description from i18n/ on load -->
<meta name="description" content="Put your life goals on autopilot. One human, thirty-four AI agents.">
<meta property="og:title" content="Should">
<meta property="og:description" content="Put your life goals on autopilot. One human, thirty-four AI agents.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ds/tokens.css">
<link rel="stylesheet" href="ds/lang.css">
<style>
:root{
  /* Page names, pointed at the design system's M3 roles (ds/tokens.css, brand "should") */
  --bg:var(--md-sys-color-surface); --card:var(--md-sys-color-surface-container-lowest);
  --ink:var(--md-sys-color-on-surface); --muted:var(--md-sys-color-on-surface-variant);
  --line:var(--md-sys-color-surface-container-highest);
  --accent:var(--md-sys-color-primary); --on-accent:var(--md-sys-color-on-primary);
  --accent-soft:var(--md-sys-color-secondary-container);
  --warm:var(--md-sys-color-tertiary); --warm-soft:var(--md-sys-color-tertiary-container);
  --bubble-me:var(--md-sys-color-primary); --bubble-them:var(--md-sys-color-surface-container-high);
  --shade:var(--md-sys-color-scrim);
  --bad:var(--md-sys-color-error); --bad-soft:var(--md-sys-color-error-container);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--md-ref-typeface-plain)}
body.locked{overflow:hidden}
.wrap{max-width:760px;margin:0 auto;padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
html,body{overflow-x:clip}
h1,h2,h3{font-family:var(--md-ref-typeface-brand);line-height:1.15;margin:0}
h2{font-size:28px;margin-bottom:10px}
section{padding:44px 0;border-top:1px solid var(--line)}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:10px}
button{font:inherit;color:inherit;cursor:pointer}

/* brand */
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:40px;height:40px;flex:0 0 40px}
.brand span{font-family:var(--md-ref-typeface-brand);font-weight:700;font-size:30px;letter-spacing:-.02em;line-height:1}
.brand i{font-style:normal;color:var(--warm)}
/* hero */
.hero{padding:52px 0 36px}
.hero .kicker{font-family:var(--md-ref-typeface-brand);font-size:20px;color:var(--accent);margin-bottom:6px}
.hero h1{font-size:clamp(40px,11vw,68px);letter-spacing:-.02em}
.hero .sub{font-size:19px;margin:14px 0 18px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center}
.stat b{display:block;font-family:var(--md-ref-typeface-brand);font-size:28px;color:var(--accent)}
.stat span{font-size:13px;color:var(--muted)}
.cta-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.btn{border:0;border-radius:999px;padding:12px 18px;font-weight:600;text-decoration:none;display:inline-block}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}

/* goal tabs */
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;margin:0 -16px;padding-left:16px;padding-right:16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.goal{padding-top:22px}
.goal-head{display:flex;gap:14px;align-items:flex-start}
.goal-ico{flex:0 0 52px;height:52px;border-radius:16px;background:var(--accent-soft);display:grid;place-items:center;font-size:26px}
.goal-ico:has(svg){background:none;flex-basis:56px;height:56px}
.goal h3{font-size:24px}
.goal .tag{color:var(--muted);margin:4px 0 0}
.who{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px}
.who button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px 3px 3px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:20px 0 8px}

/* simulators */
.sim{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:6px}
.sim h4{font-family:var(--md-ref-typeface-brand);font-size:19px;margin:0 0 2px}
.sim .note{font-size:12px;color:var(--muted);margin-top:8px}
.ctl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;margin-top:12px;font-size:14px}
.ctl output{font-weight:600}
.ctl input{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.big{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0 6px}
.big div{border-radius:12px;padding:10px;background:var(--bg)}
.big b{display:block;font-family:var(--md-ref-typeface-brand);font-size:22px}
.big span{font-size:12px;color:var(--muted)}
.big .good b{color:var(--accent)}
svg.chart{width:100%;height:auto;display:block;margin-top:8px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}

/* scenario picker + stage */
.goal h3{font-size:26px}
.goal .tag{color:var(--muted);margin:6px 0 0}
.picker{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:8px;margin:18px 0 0}
.pick{display:flex;gap:10px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.pick b{display:block;font-size:14px;line-height:1.25}
.pick small{display:block;font-size:12px;color:var(--muted);line-height:1.3}
.pk-i{flex:0 0 34px;height:34px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center;font-size:18px}
.pick[aria-selected="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.pick[aria-selected="true"] .pk-i{background:var(--accent);filter:saturate(1.1)}
.scn{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:16px;animation:rise .25s ease}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;counter-reset:f}
.flow li{position:relative;background:var(--bg);border-radius:12px;padding:8px 10px;font-size:13px;line-height:1.35}
.flow li small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:2px}
.flow li:first-child small{color:var(--warm)}
@media(max-width:520px){.flow{grid-template-columns:1fr}}
.stage{min-width:0}
.scn .sim{border:0;padding:0;margin:0;background:none}
.chat{display:grid;gap:8px;max-width:440px}
.chat .msg{max-width:100%;margin:0}
.chat .msg small{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
.chat .opts{display:grid;gap:6px}
.chat .opts button{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 10px;font-size:14px}
.chat .opts button b{flex:0 0 24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:13px}
.chat .opts button.picked{background:var(--bubble-me);color:var(--on-accent);border-color:var(--bubble-me)}
.chat .opts button.picked b{background:color-mix(in srgb,var(--on-accent) 20%,transparent);color:var(--on-accent)}
.chat .reply{display:none;margin-top:8px}
.chat .reply.show{display:block;animation:rise .2s ease}
.gets{margin:0;border-left:4px solid var(--accent);padding:4px 0 4px 12px;font-size:15px}
.gets b{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}

/* scene: job lead */
.lead-card{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--bg)}
.lc-top{display:flex;gap:12px;justify-content:space-between;align-items:center}
.ladder{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:8px}
.ld-h b{display:block;font-family:var(--md-ref-typeface-brand);font-size:18px}
.ld-h span{font-size:12px;color:var(--muted)}
.rung{display:grid;gap:1px;padding:8px 12px;border-left:3px solid var(--line);border-radius:4px}
.rung small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rung b{font-size:15px}
.rung span{font-size:13px;color:var(--muted)}
.rung.now{border-left-color:var(--accent);background:var(--accent-soft)}
.dl.pace i{background:linear-gradient(90deg,var(--accent) var(--w),var(--line) 0)}
.dl.pace li{grid-template-columns:1.4fr 1fr auto}
.lc-top b{display:block;font-family:var(--md-ref-typeface-brand);font-size:18px}
.lc-top span{font-size:13px;color:var(--muted)}
.ring{flex:0 0 64px;height:64px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:600;color:var(--ink);font-size:14px}
.checks{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:4px;font-size:14px}
.checks li:before{content:"✓";color:var(--accent);font-weight:700;margin-right:8px}
.dropped{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);display:grid;gap:2px;font-size:13px;color:var(--muted)}
.dropped small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
/* scene: documents */
.doc{border:1px solid var(--line);border-radius:6px 16px 16px 16px;padding:14px 16px;background:var(--bg);font-family:Georgia,serif;font-size:15px;line-height:1.6}
.doc-h{border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px;font-family:Inter,sans-serif}
.doc-h b{display:block}
.doc-h span{font-size:12px;color:var(--muted)}
.doc p{margin:0 0 8px}
.doc del{color:var(--muted);text-decoration-color:var(--bad)}
.doc ins{text-decoration:none;background:var(--accent-soft);border-radius:4px;padding:0 3px}
.kw{font-family:Inter,sans-serif;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.kw small{width:100%;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pill{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted)}
.pill.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.doc mark{background:var(--warm-soft);color:inherit;border-radius:3px;padding:0 2px}
.doc .note{display:block;font-family:Inter,sans-serif;font-size:12px;color:var(--warm);margin-top:2px}
/* scene: offer range */
.range{padding:42px 6px 4px}
.rg-track{position:relative;height:10px;border-radius:5px;background:var(--line)}
.rg-band{position:absolute;top:0;bottom:0;background:var(--accent-soft);border:1px solid var(--accent);border-radius:5px}
.rg-band span{position:absolute;top:16px;left:0;font-size:11px;color:var(--accent);white-space:nowrap;font-weight:600}
.mk{position:absolute;top:-34px;transform:translateX(-50%);font-style:normal;font-size:12px;text-align:center;white-space:nowrap;line-height:1.2}
.mk b{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mk:after{content:"";position:absolute;left:50%;top:30px;width:2px;height:18px;background:currentColor;transform:translateX(-50%)}
.mk.off{color:var(--muted)}.mk.floor{color:var(--warm)}.mk.ctr{color:var(--accent);font-weight:700}
.mk.floor{top:22px}.mk.floor:after{top:-12px;height:12px}
.rg-axis .mkt{color:var(--accent);font-weight:600}
.rg-axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:50px}
/* scene: statement */
.stmt{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--bg);font-size:14px}
.st-h{display:flex;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line)}
.st-h span{color:var(--muted);font-size:12px}
.stmt .row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);align-items:center}
.stmt .row:last-child{border-bottom:0}
.stmt .row>span:first-child{color:var(--muted);font-size:12px}
.stmt .row em{display:block;font-style:normal;font-size:12px}
.stmt .flag{background:var(--bad-soft)}.stmt .flag em{color:var(--bad)}
.stmt .due{background:var(--warm-soft)}.stmt .due em{color:var(--warm)}
/* scene: business dashboard + tree */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpis div{background:var(--bg);border-radius:14px;padding:10px;min-width:0}
.kpis small{display:block;font-size:11px;color:var(--muted)}
.kpis b{display:block;font-family:var(--md-ref-typeface-brand);font-size:22px}
.kpis span{font-size:11px;color:var(--muted)}
.kpis .up{color:var(--accent)}
.kpis .warn b{color:var(--bad)}
@media(max-width:520px){.kpis{grid-template-columns:1fr}}
.dl{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px;font-size:13px}
.dl li{display:grid;grid-template-columns:minmax(0,1fr) 90px 40px;gap:8px;align-items:center}
.dl i{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--warm) var(--w),var(--line) 0)}
.dl b{text-align:right}
.tree{display:grid;justify-items:center;gap:22px;padding:6px 0}
.node{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 12px;text-align:center;font-weight:600;font-size:14px;position:relative}
.node small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.node.top{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.node.top small{color:color-mix(in srgb,var(--on-accent) 85%,transparent)}
.node.top:after{content:"";position:absolute;left:50%;bottom:-23px;width:2px;height:22px;background:var(--line)}
.kids{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;position:relative;padding-top:12px;border-top:2px solid var(--line)}
.kids .node:before{content:"";position:absolute;left:50%;top:-13px;width:2px;height:12px;background:var(--line)}
.node.new{border:2px dashed var(--accent)}
@media(max-width:520px){.kids{grid-template-columns:1fr;border-top:0;padding-top:0}.kids .node:before{display:none}}
/* scene: meals + streak + birthdays */
.meals{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.meals div{background:var(--bg);border-radius:12px;padding:8px 4px;text-align:center;min-width:0}
.meals small{display:block;font-size:11px;color:var(--muted)}
.meals span{font-size:22px;display:block}
.meals b{display:block;font-size:11px;font-weight:500;line-height:1.25}
@media(max-width:560px){.meals{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cart{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-top:10px;font-size:13px;color:var(--muted)}
.cart b{font-family:var(--md-ref-typeface-brand);font-size:20px;color:var(--ink)}
.why{font-family:var(--md-ref-typeface-brand);font-size:18px;background:var(--bg);border-radius:14px;padding:12px 14px}
.why small{display:block;font-family:Inter,sans-serif;font-size:11px;color:var(--muted);margin-bottom:4px}
.dots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:12px 0;max-width:280px}
.dots i{aspect-ratio:1;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.dots i.today{background:var(--warm);box-shadow:0 0 0 3px var(--warm-soft)}
.st-n{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.st-n b{display:block;font-family:var(--md-ref-typeface-brand);font-size:22px;color:var(--accent)}
.st-n span{font-size:12px;color:var(--muted)}
.bd{display:grid;gap:8px}
.bd-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--bg);border-radius:14px;padding:10px 12px}
.bd-row.on{box-shadow:0 0 0 2px var(--accent) inset}
.av{width:40px;height:40px;border-radius:50%;background:var(--warm-soft);color:var(--warm);display:grid;place-items:center;font-weight:700}
.bd-row small{display:block;font-size:12px;color:var(--muted)}
.when{text-align:right}
/* scene: repair + scam */
.repair{display:grid;gap:10px}
.repair .msg.me{margin:0 0 0 auto}
.verdict{background:var(--accent-soft);border-radius:14px;padding:12px 14px}
.verdict small,.draft small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--accent)}
.verdict b{font-family:var(--md-ref-typeface-brand);font-size:20px}
.verdict p{margin:4px 0 0;font-size:14px}
.draft{border:1px dashed var(--line);border-radius:14px;padding:10px 14px;font-size:14px}
.draft small{color:var(--muted)}
.call{color-scheme:dark;background:var(--md-sys-color-surface-container-low);color:var(--md-sys-color-on-surface);border-radius:24px;padding:18px;max-width:360px}
.call small{display:block;font-size:11px;color:var(--md-sys-color-on-surface-variant);text-align:center}
.call>b{display:block;text-align:center;font-size:18px;margin-bottom:10px}
.call .bub{background:var(--md-sys-color-surface-container-high);border-radius:16px 16px 16px 6px;padding:10px 12px;font-size:14px}
.alarm{margin-top:10px;background:var(--md-sys-color-error-container);color:var(--md-sys-color-on-error-container);border:1px solid var(--md-sys-color-error);border-radius:12px;padding:10px 12px;font-size:13px}
.alarm b{display:block;color:var(--md-sys-color-error)}

/* scene: price watch + outfit */
.price{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--bg)}
.pr-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.pr-top b{display:block;font-family:var(--md-ref-typeface-brand);font-size:18px}
.pr-top span{font-size:13px;color:var(--muted)}
.pr-now{text-align:right;flex:0 0 auto}
.pr-now b{color:var(--accent);font-size:24px}
.pr-now s{font-size:13px;color:var(--muted)}
.spark{width:100%;height:90px;display:block;margin-top:10px}
.pr-ax{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted)}
.pr-ax .tg{color:var(--warm)}
.outfit{display:grid;gap:10px}
.day{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.day div{background:var(--bg);border-radius:12px;padding:8px 10px;min-width:0}
.day small{display:block;font-size:11px;color:var(--muted)}
.day b{display:block;font-size:14px}
.day span{font-size:12px;color:var(--muted)}
.fit{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.fit div{border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;min-width:0}
.fit span{font-size:28px;display:block}
.fit b{display:block;font-size:13px}
.fit small{font-size:11px;color:var(--muted)}
@media(max-width:520px){.fit{grid-template-columns:repeat(2,minmax(0,1fr))}.day{grid-template-columns:1fr}}
/* scene: co-parenting + contact */
.cop{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:12px}
@media(max-width:560px){.cop{grid-template-columns:1fr}}
.cal{background:var(--bg);border-radius:14px;padding:10px}
.cal small,.hand small,.split small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;font-size:11px;font-style:normal}
.cal-g i{font-style:normal;padding:4px 0;border-radius:6px}
.cal-g i.h{color:var(--muted);font-weight:600}
.cal-g i.k{background:var(--accent-soft);color:var(--accent);font-weight:600}
.cal-g i.t{box-shadow:0 0 0 2px var(--warm) inset}
.cal span{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-top:6px}
.sw{width:12px;height:12px;border-radius:3px;background:var(--accent-soft);display:inline-block}
.cop-r{display:grid;gap:10px;align-content:start}
.hand{background:var(--accent-soft);border-radius:14px;padding:10px 12px}
.hand b{display:block}
.hand span{font-size:13px;color:var(--muted)}
.split{border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:4px}
.split div{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;font-size:14px;align-items:baseline}
.split em{font-style:normal;font-size:12px;color:var(--accent)}
.vcard{background:var(--bg);border-radius:16px;padding:14px;display:grid;grid-template-columns:56px minmax(0,1fr);gap:4px 12px;align-items:center}
.av.big{width:56px;height:56px;font-size:18px;background:var(--accent-soft);color:var(--accent)}
.vcard b{display:block;font-family:var(--md-ref-typeface-brand);font-size:19px}
.vcard small{color:var(--muted)}
.vcard ul{grid-column:1/-1;list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px;font-size:14px}
.vcard ul i{font-style:normal;margin-right:8px}
/* staff grid */
.staff{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:1fr;gap:8px;margin-top:18px}
@media(min-width:620px){.staff{grid-template-columns:repeat(4,minmax(0,1fr))}}
.agent{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:104px;min-width:0;overflow-wrap:anywhere}
.agent div,.agent b,.agent span{min-width:0}
.agent .ico{width:44px;height:44px;display:grid;place-items:center}
.agent b{font-family:var(--md-ref-typeface-brand);font-size:15px;line-height:1.2}
.agent span{font-size:12px;color:var(--muted);line-height:1.3}
.staff.leads{grid-template-columns:repeat(2,minmax(0,1fr))!important}
.agent.lead{flex-direction:row;align-items:center;border-color:var(--accent);min-height:0}
.agent div{display:flex;flex-direction:column;gap:3px}
.agent .soon{align-self:flex-start;font-size:10px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 6px}
.agent:has(.soon){opacity:.8;border-style:dashed}

/* sheet */
.shade{position:fixed;inset:0;background:var(--shade);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.shade.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:86vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:10px 18px 30px;transform:translateY(105%);transition:transform .25s ease;z-index:21;max-width:760px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet .x{position:absolute;right:14px;top:12px;border:0;background:var(--card);border-radius:50%;width:34px;height:34px;font-size:18px}
.kv{display:grid;gap:8px;margin-top:12px}
.kv div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.kv small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* timeline */
.tl{list-style:none;padding:0;margin:16px 0 0;position:relative}
.tl:before{content:"";position:absolute;left:62px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:22px;padding:8px 0;position:relative}
.tl li:after{content:"";position:absolute;left:57px;top:15px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
.tl time{font-weight:600;font-size:14px;text-align:right;padding-top:2px}
.tl div{font-size:15px}
.tl small{display:block;color:var(--muted);font-size:13px}

/* phone */
.phone{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:18px 14px;max-width:380px;margin:18px auto 0}
.phones{display:grid;gap:12px}
@media(min-width:720px){.phones{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}.phones .phone{margin:18px 0 0}}
.phone .whoname{text-align:center;font-size:13px;color:var(--muted);margin-bottom:10px}
.msg{max-width:85%;padding:10px 13px;border-radius:18px;margin:6px 0;font-size:15px;line-height:1.4}
.them{background:var(--bubble-them);border-bottom-left-radius:6px}
.me{background:var(--bubble-me);color:var(--on-accent);margin-left:auto;border-bottom-right-radius:6px;width:max-content}
.time{font-size:11px;color:var(--muted);text-align:center;margin:10px 0 4px}

.rules{display:grid;gap:10px;margin-top:16px}
.rule{background:var(--card);border-left:4px solid var(--warm);border-radius:10px;padding:12px 14px;font-size:15px}
.rule b{display:block;margin-bottom:2px}
.built{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px}
.cta{background:var(--accent);color:var(--on-accent);border-radius:20px;padding:26px 20px;text-align:center}
.cta h2{color:var(--on-accent)}
.cta p{color:color-mix(in srgb,var(--on-accent) 90%,transparent);margin:0}
footer{padding:30px 0 50px;font-size:13px;color:var(--muted);text-align:center}
@media(min-width:720px){
  .goals-layout{display:grid;grid-template-columns:170px minmax(0,1fr);gap:24px;align-items:start}
  .goals-layout .tabs{position:sticky;top:16px;flex-direction:column;gap:4px;margin:22px 0 0;padding:0 16px 0 0;overflow:visible;background:transparent;border-bottom:0;border-right:1px solid var(--line)}
  .goals-layout .tab{width:100%;text-align:left;border-radius:10px;border-color:transparent;background:transparent;padding:10px 12px;font-size:15px}
  .goals-layout .tab:hover{background:var(--card)}
  .goals-layout .tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

    <div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="var(--accent)"/><path d="M17 34.5 L27.5 44.5 L45 23" fill="none" stroke="var(--card)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="50" cy="16.5" r="5" fill="var(--warm)"/></svg><span>should<i>.</i></span></div>

<script>
/* Structure only. Every visible word is in i18n/en.js and i18n/es.js (same shape, checked by ds/check-i18n.mjs). */
const AGENTS = {
  ea:{i:"🧭"}, book:{i:"📒"}, sched:{bg:true,i:"🗓️"}, pi:{i:"🔎"}, health:{i:"🩺"}, text:{i:"💬"}, phil:{i:"📚"}, sec:{i:"🛡️"},
  comp:{i:"⚖️"}, bcoach:{i:"🧭",toYou:true}, coach:{i:"🏁"}, career:{i:"💼"}, wealth:{i:"📈"}, travel:{i:"✈️"}, shop:{i:"🛒"},
  clothier:{i:"👔"}, house:{i:"🏠"}, pets:{i:"🐾"}, move:{i:"📦"}, gift:{i:"🎁"}, relmgr:{i:"🤝"}, events:{i:"🎉"}, legal:{i:"⚖️"},
  music:{i:"🎹"}, web:{i:"🖥️"}, pr:{i:"📣"}, media:{i:"🎬"}, guide:{i:"📍"}, biz:{i:"🏢"}, arch:{i:"🏗️"}, dba:{i:"🗄️"}, it:{i:"🛠️"},
  pm:{i:"🧩"}, rel:{i:"💬",soon:true},
};
// Each agent's person avatar comes from the design system (ds/avatars.js), keyed by org role
const ORG={ea:"assistant",book:"bookkeeper",sched:"scheduler",pi:"investigator",health:"health",text:"text-concierge",phil:"philosopher",sec:"security",comp:"compliance",bcoach:"business_coach",coach:"coach",career:"career",wealth:"financial",travel:"travel",shop:"shopping",clothier:"clothier",house:"home-manager",pets:"pets",move:"relocation",gift:"gifts",relmgr:"relationship-manager",events:"events",legal:"legal",music:"music",web:"webmaster",pr:"pr",media:"media",guide:"local-guide",biz:"business",arch:"as-architect",dba:"dba",it:"it",pm:"product",rel:"relationships"};

const GOALS = [
 {id:"career",agents:["career","coach","pi","pr"],sc:[{ico:"🎯",scene:"lead"},{ico:"✍️",scene:"resume"},{ico:"🤝",scene:"offer",sim:"negotiate"},{ico:"🪜",scene:"ladder"}]},
 {id:"money",agents:["wealth","coach","book","pi"],sc:[{ico:"📈",sim:"trade"},{ico:"🏖️",sim:"retire"},{ico:"🧾",scene:"stmt"},{ico:"🪜",scene:"ladder"}]},
 {id:"business",agents:["biz","bcoach","arch","book","legal"],sc:[{ico:"📊",scene:"dash"},{ico:"🌳",scene:"tree"},{ico:"🪜",scene:"ladder"}]},
 {id:"health",agents:["health","coach","shop"],sc:[{ico:"⚖️",sim:"body"},{ico:"🥘",scene:"meals"},{ico:"🩺"},{ico:"🚭",scene:"streak"},{ico:"🪜",scene:"ladder"}]},
 {id:"home",agents:["relmgr","coach","house","pets"],sc:[{ico:"👨‍👧‍👦",scene:"coparent"},{ico:"🔧",scene:"repair"},{ico:"🪜",scene:"ladder"}]},
 {id:"style",agents:["shop","coach","clothier","gift"],sc:[{ico:"🏷️",scene:"price"},{ico:"👔",scene:"outfit"},{ico:"🎂",scene:"bdays"},{ico:"🪜",scene:"ladder"}]},
 {id:"trust",agents:["relmgr","coach","pi","legal"],sc:[{ico:"📇",scene:"contact"},{ico:"📄",scene:"doc"},{ico:"🪜",scene:"ladder"}]},
 {id:"coaching",agents:["coach","bcoach"],sc:[{ico:"🗓️",scene:"week"},{ico:"📏",scene:"pace"},{ico:"🧭",scene:"review"},{ico:"📓",scene:"log"}]},
];
const LEADS=["ea","coach"]; // your go-to agents; everyone else reports to them. bg:true = background role, not shown

/* ---------- language ---------- */
const I=window.DSI18n, DICT=window.SHOULD_I18N;
let lang=I.pickLang(), L=DICT[lang];
const fmt=(s,v)=>String(s).replace(/\{(\w+)\}/g,(m,k)=>k in v?v[k]:m);
const agent=k=>({...AGENTS[k],...L.agents[k]});
const goalText=id=>L.goals[id];

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>"$"+Math.round(n).toLocaleString(L.sims.money_locale);
const av=(k,size,badge=true)=>window.DSAvatars?DSAvatars.avatarSVG(ORG[k]||k,{size,badge,label:agent(k).n}):AGENTS[k].i;

/* ---------- scenes: one picture per scenario ---------- */
const rung=(r,now)=>`<div class="rung${now?" now":""}"><small>${r[0]}</small><b>${r[1]}</b><span>${r[2]}</span></div>`;
const SCENES={
 lead:()=>{const S=L.scenes.lead;return `<div class="lead-card"><div class="lc-top"><div><b>${S.role}</b><span>${S.co}</span></div><div class="ring" style="--p:92"><span>92%</span></div></div>
  <ul class="checks">${S.checks.map(c=>`<li>${c}</li>`).join("")}</ul>
  <div class="dropped"><small>${S.dropped_h}</small>${S.dropped.map(d=>`<s>${esc(d)}</s>`).join("")}</div></div>`},
 resume:()=>{const S=L.scenes.resume,on=[1,1,1,1,0];return `<div class="doc"><div class="doc-h"><b>${S.name}</b><span>${S.tailored}</span></div>
  ${S.rows.map(r=>`<p><del>${r[0]}</del> <ins>${r[1]}</ins></p>`).join("")}<p>${S.plain}</p>
  <div class="kw"><small>${S.kw_h}</small>${S.kw.map((k,i)=>`<span class="pill${on[i]?" on":""}">${k}</span>`).join("")}</div></div>`},
 offer:()=>{const S=L.scenes.offer,X=v=>((v-140)/60*100).toFixed(1)+"%";return `<div class="range"><div class="rg-track"><div class="rg-band" style="left:${X(170)};width:${(15/60*100).toFixed(1)}%"></div>
  <i class="mk off" style="left:${X(160)}"><b>${S.offer}</b>$160k</i><i class="mk floor" style="left:${X(165)}"><b>${S.floor}</b>$165k</i><i class="mk ctr" style="left:${X(178)}"><b>${S.counter}</b>$178k</i></div>
  <div class="rg-axis"><span>$140k</span><span class="mkt">${S.market}</span><span>$200k</span></div></div>`},
 ladder:w=>{const Lw=w.text.ladder;return `<div class="ladder"><div class="ld-h"><b>${Lw.h}</b><span>${Lw.sub}</span></div>${Lw.rungs.map((r,i)=>rung(r,i===2)).join("")}</div>`},
 week:()=>{const S=L.scenes.week;return `<div class="ladder"><div class="ld-h"><b>${S.h}</b><span>${S.sub}</span></div>${S.rows.map(r=>rung(r)).join("")}${rung(S.now,1)}</div>`},
 pace:()=>{const S=L.scenes.pace,pct=[70,45,50];return `<div class="ladder"><div class="ld-h"><b>${S.h}</b><span>${S.sub}</span></div>
  <ul class="dl pace">${S.rows.map((r,i)=>`<li><span>${r[0]}</span><i style="--w:${pct[i]}%"></i><b>${r[1]}</b></li>`).join("")}</ul></div>`},
 review:()=>{const S=L.scenes.review,met=[1,1,0];return `<div class="ladder"><div class="ld-h"><b>${S.h}</b><span>${S.sub}</span></div>${S.rows.map((r,i)=>rung(r,!met[i])).join("")}${rung(S.jan)}</div>`},
 log:()=>{const S=L.scenes.log;return `<div class="ladder"><div class="ld-h"><b>${S.h}</b><span>${S.sub}</span></div>${S.rows.map(r=>rung(r)).join("")}</div>`},
 stmt:()=>{const S=L.scenes.stmt,cls=["","flag","","due"];return `<div class="stmt"><div class="st-h"><b>${S.h}</b><span>${S.sub}</span></div>
  ${S.rows.map((r,i)=>`<div class="row${cls[i]?" "+cls[i]:""}"><span>${r[0]}</span><span>${r[1]}${r[3]?`<em>${r[3]}</em>`:""}</span><b>${r[2]}</b></div>`).join("")}</div>`},
 dash:()=>{const S=L.scenes.dash,cls=["","warn",""],w=[60,25,10];return `<div class="kpis">${S.kpis.map((k,i)=>`<div${cls[i]?` class="${cls[i]}"`:""}><small>${k[0]}</small><b>${k[1]}</b><span${i===0?' class="up"':""}>${k[2]}</span></div>`).join("")}</div>
  <ul class="dl">${S.dl.map((d,i)=>`<li><span>${d[0]}</span><i style="--w:${w[i]}%"></i><b>${d[1]}</b></li>`).join("")}</ul>`},
 tree:()=>{const S=L.scenes.tree,cls=["","new",""];return `<div class="tree"><div class="node top">${S.top[0]}<small>${S.top[1]}</small></div><div class="kids">${S.kids.map((k,i)=>`<div class="node${cls[i]?" "+cls[i]:""}">${k[0]}<small>${k[1]}</small></div>`).join("")}</div></div>`},
 meals:()=>{const S=L.scenes.meals,ico=["🌮","🐟","🍗","🥩","🍤","🍲","🥗"];
  return `<div class="meals">${S.days.map((d,i)=>`<div><small>${d[0]}</small><span>${ico[i]}</span><b>${d[1]}</b></div>`).join("")}</div><div class="cart"><span>${S.cart}</span><b>${S.total}</b><span>${S.protein}</span></div>`},
 streak:()=>{const S=L.scenes.streak;return `<div class="streak"><div class="why"><small>${S.why_h}</small>${esc(S.why)}</div>
  <div class="dots">${Array.from({length:35},(_,i)=>`<i class="${i<29?"on":i===29?"today":""}"></i>`).join("")}</div>
  <div class="st-n">${S.n.map(n=>`<div><b>${n[0]}</b><span>${n[1]}</span></div>`).join("")}</div></div>`},

 price:()=>{const S=L.scenes.price,P=[495,495,479,489,469,475,449,459,439,449,415,389];const max=500,min=370,X=i=>(i/(P.length-1)*100).toFixed(1),Y=v=>((max-v)/(max-min)*100).toFixed(1);
  return `<div class="price"><div class="pr-top"><div><b>${S.title}</b><span>${S.sub}</span></div><div class="pr-now"><b>${S.now}</b><s>${S.was}</s></div></div>

 outfit:()=>{const S=L.scenes.outfit,ico=["🧥","👕","👖","🥾"];return `<div class="outfit"><div class="day">${S.day.map(d=>`<div><small>${d[0]}</small><b>${d[1]}</b><span>${d[2]}</span></div>`).join("")}</div>

/* ---------- simulators ---------- */
function chart(series,{w=320,h=170,yfmt=v=>v,xlab=[]}={}){
  const all=series.flatMap(s=>s.d); const max=Math.max(...all), min=Math.min(0,...all)*0+Math.min(...series.map(s=>s.min??Math.min(...s.d)));
  const lo=series[0].lo??min, hi=max*1.05; const n=series[0].d.length;
  const X=i=>34+(w-44)*i/(n-1), Y=v=>h-22-(h-34)*(v-lo)/(hi-lo||1);
  let g=`<svg class="chart" viewBox="0 0 ${w} ${h}" role="img">`;
  [0,.5,1].forEach(f=>{const v=lo+(hi-lo)*f; g+=`<line x1="34" x2="${w-10}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="30" y="${Y(v)+4}" font-size="10" text-anchor="end" fill="var(--muted)">${yfmt(v)}</text>`});
  xlab.forEach(([i,t])=>g+=`<text x="${X(i)}" y="${h-6}" font-size="10" text-anchor="${i===0?'start':i===n-1?'end':'middle'}" fill="var(--muted)">${t}</text>`);
  series.forEach(s=>{g+=`<polyline fill="none" stroke="${s.c}" stroke-width="2.5" stroke-linejoin="round" ${s.dash?'stroke-dasharray="5 4"':''} points="${s.d.map((v,i)=>X(i).toFixed(1)+","+Y(v).toFixed(1)).join(" ")}"/>`});
  return g+`</svg>`;
}
function ctl(id,label,min,max,step,val,f){return `<label class="ctl" for="${id}"><span>${label}</span><output id="${id}o">${f(val)}</output><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"></label>`}
const kfmt=v=>v>=1e6?"$"+(v/1e6).toFixed(1)+"M":"$"+Math.round(v/1e3)+"k";

const SIMS={
 trade(el){
  const S=L.sims.trade;
  const ST={index:{r:.07,c:-.34},core:{r:.078,c:-.28},mom:{r:.085,c:-.42},lowvol:{r:.064,c:-.2},div:{r:.066,c:-.26}};
  const SC={typical:{b:0,crash:false},crash:{b:0,crash:true},boom:{b:.04,crash:false}};
  const yrs=v=>fmt(S.years_fmt,{n:v});
  let st="core",sc="typical";
  el.innerHTML=`<div class="sim"><h4>${S.h}</h4><p class="muted" style="margin:0;font-size:14px">${S.p}</p>
   <div class="built" id="tS">${Object.keys(ST).map(k=>`<button class="chip" data-st="${k}">${S.st[k][0]}</button>`).join("")}</div>
   <p class="muted" id="tV" style="margin:8px 0 0;font-size:13px"></p>
   <div class="built" id="tC">${Object.keys(SC).map(k=>`<button class="chip" data-sc="${k}">${S.sc[k]}</button>`).join("")}</div>
   ${ctl("ta",S.start,"1000","100000","1000","10000",money)}
   ${ctl("tm",S.monthly,"0","2000","50","300",money)}
   ${ctl("ty",S.years,"3","30","1","10",yrs)}
   <div class="big"><div><span>${S.index}</span><b id="tA"></b></div><div class="good"><span id="tBl"></span><b id="tB"></b></div></div>
   <div class="legend"><span><i style="background:var(--muted)"></i>${S.index}</span><span><i style="background:var(--accent)"></i><span id="tL"></span></span><span id="tW"></span></div>
   <div id="tCh"></div><p class="note">${S.note}</p></div>`;
  const path=(o,s,y,a,m)=>{let v=a,d=[v],peak=v,worst=0;for(let i=1;i<=y;i++){let r=o.r+s.b;if(s.crash&&i===2)r=o.c;if(s.crash&&i===3)r=o.r+Math.abs(o.c)*.45;v=v*(1+r)+m*12;d.push(v);peak=Math.max(peak,v);worst=Math.min(worst,v/peak-1)}return {d,worst}};
  const run=()=>{const a=+$("#ta").value,m=+$("#tm").value,y=+$("#ty").value;$("#tao").textContent=money(a);$("#tmo").textContent=money(m);$("#tyo").textContent=yrs(y);
   el.querySelectorAll("[data-st]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.st===st));el.querySelectorAll("[data-sc]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.sc===sc));
   el.querySelectorAll(".chip").forEach(b=>{const on=b.getAttribute("aria-pressed")==="true";b.style.background=on?"var(--accent)":"";b.style.color=on?"var(--on-accent)":"";b.style.borderColor=on?"var(--accent)":""});
   const Ix=path(ST.index,SC[sc],y,a,m),Sx=path(ST[st],SC[sc],y,a,m);
   $("#tV").textContent=S.st[st][1];$("#tA").textContent=money(Ix.d.at(-1));$("#tB").textContent=money(Sx.d.at(-1));$("#tBl").textContent=S.st[st][0];$("#tL").textContent=S.st[st][0];
   $("#tW").textContent=SC[sc].crash?fmt(S.crash_fmt,{a:Math.round(ST[st].c*100),b:Math.round(ST.index.c*100)}):"";
   $("#tCh").innerHTML=chart([{d:Ix.d,c:"var(--muted)",dash:1,lo:0},{d:Sx.d,c:"var(--accent)",lo:0}],{yfmt:kfmt,xlab:[[0,S.now],[y,fmt(S.yrs_fmt,{n:y})]]});};
  el.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{st=b.dataset.st;run()});
  el.querySelectorAll("[data-sc]").forEach(b=>b.onclick=()=>{sc=b.dataset.sc;run()});
  el.querySelectorAll("input").forEach(i=>i.oninput=run);run();
 },
 retire(el){
  const S=L.sims.retire,pct=v=>fmt(S.now_fmt,{n:v});
  el.innerHTML=`<div class="sim"><h4>${S.h}</h4><p class="muted" style="margin:0;font-size:14px">${S.p}</p>
   ${ctl("ra",S.now,"2","15","1","5",pct)}
   ${ctl("rm",S.match,"0","6","1","4",v=>v+"%")}
   ${ctl("rr",S.ret,"3","9","0.5","6",v=>v+"%")}
   <div class="big"><div><span>${S.a}</span><b id="rA"></b></div><div class="good"><span>${S.b}</span><b id="rB"></b></div></div>
   <div class="legend"><span><i style="background:var(--muted)"></i>${S.leg_a}</span><span><i style="background:var(--accent)"></i>${S.leg_b}</span></div>
   <div id="rC"></div><p class="note">${S.note}</p></div>`;
  const run=()=>{
   const a=+$("#ra").value,m=+$("#rm").value,r=+$("#rr").value/100;
   $("#rao").textContent=pct(a);$("#rmo").textContent=m+"%";$("#rro").textContent=r*100+"%";
   let A=45000,B=45000,pay=110000,pctB=Math.max(a,m),da=[],db=[];
   for(let y=38;y<=65;y++){da.push(A);db.push(B);
     A=A*(1+r)+pay*(a+Math.min(a,m))/100; B=B*(1+r)+pay*(pctB+m)/100; pay*=1.025; pctB=Math.min(15,pctB+1);}
   $("#rA").textContent=money(da.at(-1));$("#rB").textContent=money(db.at(-1));
   $("#rC").innerHTML=chart([{d:da,c:"var(--muted)",dash:1,lo:0},{d:db,c:"var(--accent)",lo:0}],{yfmt:kfmt,xlab:[[0,"38"],[12,"50"],[27,"65"]]});
  };
  el.querySelectorAll("input").forEach(i=>i.oninput=run);run();
 },
 negotiate(el){
  const S=L.sims.negotiate,yrs=v=>fmt(S.years_fmt,{n:v});
  el.innerHTML=`<div class="sim"><h4>${S.h}</h4><p class="muted" style="margin:0;font-size:14px">${S.p}</p>
   ${ctl("na",S.base,"80000","300000","5000","160000",money)}
   ${ctl("nb",S.up,"0","15","1","8",v=>v+"%")}
   ${ctl("nc",S.span,"5","25","1","15",yrs)}
   <div class="big"><div><span>${S.a}</span><b id="nA"></b></div><div class="good"><span>${S.b}</span><b id="nB"></b></div></div>
   <div class="legend"><span><i style="background:var(--muted)"></i>${S.leg_a}</span><span><i style="background:var(--accent)"></i>${S.leg_b}</span></div>
   <div id="nC"></div><p class="note">${S.note}</p></div>`;
  const run=()=>{
   const a=+$("#na").value,b=+$("#nb").value/100,y=+$("#nc").value;
   $("#nao").textContent=money(a);$("#nbo").textContent=Math.round(b*100)+"%";$("#nco").textContent=yrs(y);
   let p=a,q=a*(1+b),tot=0,da=[],db=[];
   for(let i=0;i<y;i++){da.push(p);db.push(q);tot+=q-p;p*=1.03;q*=1.03;}
   $("#nA").textContent=money(a*b);$("#nB").textContent=money(tot);
   $("#nC").innerHTML=chart([{d:da,c:"var(--muted)",dash:1,lo:a*.9},{d:db,c:"var(--accent)",lo:a*.9}],{yfmt:v=>"$"+Math.round(v/1e3)+"k",xlab:[[0,fmt(S.year_fmt,{n:1})],[y-1,fmt(S.year_fmt,{n:y})]]});
  };
  el.querySelectorAll("input").forEach(i=>i.oninput=run);run();
 },
 body(el){
  // The model runs in pounds; the dictionary sets the display unit (lb or kg)
  const S=L.sims.body,k=S.per_lb,u=S.unit,wt=v=>Math.round(v*k)+" "+u,pace=v=>fmt(S.pace_fmt,{n:+(v*k).toFixed(2),u});
  el.innerHTML=`<div class="sim"><h4>${S.h}</h4><p class="muted" style="margin:0;font-size:14px">${S.p}</p>
   ${ctl("ba",S.goal,"170","205","1","185",wt)}
   ${ctl("bb",S.pace,"0.5","2","0.25","1",pace)}
   <div class="big"><div><span>${S.a}</span><b id="bA"></b></div><div class="good"><span>${S.b}</span><b id="bB"></b></div></div>
   <div class="legend"><span><i style="background:var(--accent)"></i>${fmt(S.leg_w,{u})}</span></div>
   <div id="bC"></div>
   <div class="legend" style="margin-top:10px"><span><i style="background:var(--warm)"></i>${S.leg_f}</span></div>
   <div id="bD"></div><p class="note">${S.note}</p></div>`;
  const run=()=>{
   const goal=+$("#ba").value,rate=+$("#bb").value;
   $("#bao").textContent=wt(goal);$("#bbo").textContent=pace(rate);
   let w=210,fat=210*.28,wk=0,dw=[],df=[];
   const fatShare=rate<=1?.9:rate<=1.5?.8:.7;
   while(w>goal&&wk<104){dw.push(w*k);df.push(fat/w*100);const d=Math.min(rate,w-goal);w-=d;fat-=d*fatShare;wk++;}
   dw.push(w*k);df.push(fat/w*100);
   $("#bA").textContent=fmt(S.weeks_fmt,{n:wk});$("#bB").textContent=(fat/w*100).toFixed(1)+"%";
   const xl=[[0,S.now],[dw.length-1,fmt(S.week_fmt,{n:wk})]];
   $("#bC").innerHTML=chart([{d:dw,c:"var(--accent)",lo:Math.min(...dw)-8*k}],{h:140,yfmt:v=>Math.round(v)+"",xlab:xl});
   $("#bD").innerHTML=chart([{d:df,c:"var(--warm)",lo:Math.min(...df)-3}],{h:120,yfmt:v=>Math.round(v)+"%",xlab:xl});
  };
  el.querySelectorAll("input").forEach(i=>i.oninput=run);run();
 }
};

/* ---------- static sections, staff + sheet ---------- */
function renderStatic(){
  I.translate(L);
  document.title=L.meta.title;
  document.querySelector('meta[name="description"]').content=L.meta.description;
  document.querySelectorAll("[data-phone]").forEach(el=>{
    el.innerHTML=L.ui[el.dataset.phone].map(([k,h])=>k==="who"?`<div class="whoname">${h}</div>`:k==="time"?`<div class="time">${h}</div>`:`<div class="msg ${k}">${h}</div>`).join("");
  });
  document.querySelectorAll("[data-rules]").forEach(el=>{el.innerHTML=L.ui[el.dataset.rules].map(([b,t])=>`<div class="rule"><b>${b}</b>${t}</div>`).join("")});
  $("#day").innerHTML=L.ui.day.map(([t,b,s])=>`<li><time>${t}</time><div>${b}<small>${s}</small></div></li>`).join("");
  $("#built").innerHTML=L.ui.built_chips.map(c=>`<span class="chip">${c}</span>`).join("");
}
function renderStaff(){
  const order=Object.keys(AGENTS).filter(k=>!AGENTS[k].bg).sort((a,b)=>LEADS.includes(b)-LEADS.includes(a));
  const card=k=>{const a=agent(k);const lead=LEADS.includes(k);
    return `<button class="agent${lead?" lead":""}" data-agent="${k}"><span class="ico">${av(k,44)}</span><div><b>${a.n}</b>${a.soon?`<span class="soon">${L.ui.coming_soon}</span>`:""}<span>${esc(a.job.split(". ")[0].replace(/\.$/,""))}</span></div></button>`};
  $("#leadgrid").innerHTML=LEADS.map(card).join("");
  $("#staffgrid").innerHTML=order.filter(k=>!LEADS.includes(k)).map(card).join("");
}
function openAgent(k){
  const a=agent(k); const goals=GOALS.filter(g=>g.agents.includes(k));
  $("#sheetBody").innerHTML=`<div style="display:flex;gap:12px;align-items:center;margin:4px 40px 6px 0"><div class="goal-ico">${av(k,56)}</div><h3 id="sheetTitle" style="font-size:24px">${a.n}</h3></div>
   <p>${esc(a.job)}</p>
   <div class="kv"><div><small>${L.ui.routines}</small>${a.routines.map(esc).join(" · ")}</div>
   <div><small>${L.ui.never}</small>${esc(a.never)}</div>
   ${goals.length?`<div><small>${L.ui.works_on}</small>${goals.map(g=>`<button class="tab" style="margin:6px 6px 0 0" data-jump="${g.id}">${goalText(g.id).tab}</button>`).join("")}</div>`:""}
   <div><small>${L.ui.reports_to}</small>${LEADS.includes(k)||a.toYou?L.ui.you:agent("ea").n}</div></div>`;
  $("#shade").classList.add("on");$("#sheet").classList.add("on");document.body.classList.add("locked");$("#sheetX").focus();
}
function closeSheet(){$("#shade").classList.remove("on");$("#sheet").classList.remove("on");document.body.classList.remove("locked")}

function setLang(l){
  lang=l; L=DICT[l]; I.applyLang(l);
  renderStatic(); renderStaff(); renderGoal(current.id,current.si); closeSheet();
  menu.set(l,L.meta.lang_label);
}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-si],[data-g],[data-agent],[data-jump],[data-reply]");
  if(!t)return;
  if(t.dataset.si!==undefined){renderGoal(t.dataset.gid,+t.dataset.si);}
  else if(t.dataset.g){renderGoal(t.dataset.g);}
  else if(t.dataset.agent){openAgent(t.dataset.agent);}
  else if(t.dataset.jump){closeSheet();renderGoal(t.dataset.jump);$("#goals").scrollIntoView();}
  else if(t.dataset.reply!==undefined){const box=t.closest(".ask");box.querySelectorAll("button").forEach(b=>b.classList.remove("picked"));t.classList.add("picked");const r=box.querySelector(".reply");r.textContent=t.dataset.reply;r.classList.add("show");}
});
$("#shade").onclick=closeSheet;$("#sheetX").onclick=closeSheet;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
const menu=I.langMenu($("#lang"),{current:lang,label:L.meta.lang_label,onChange:setLang});
setLang(lang);
</script>
